# Publishes a GitHub Release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match __version__ in expense_tracker/__init__.py. Builds on a Windows machine:
# runs the tests, builds the portable zip and the installer, and attaches both to the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = python -c "import expense_tracker; print(expense_tracker.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match __version__ $version in expense_tracker/__init__.py"
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the portable zip and the installer
        run: python build.py
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist -File).FullName
          gh release create "${{ github.ref_name }}" $files --title "Budget Tracker ${{ github.ref_name }}" --notes-file installer/release-notes.md
